{% macro render_field(field) %}
    <div class="mb-3">
        {{ field.label(class="form-label") }}

        {% set css = "form-select"
            if field.type == "SelectField"
            else "form-control" %}

        {{ field(
            class=css ~ (" is-invalid" if field.errors else ""),
            **kwargs
        ) }}

        {% for error in field.errors %}
            <div class="invalid-feedback d-block">
                {{ error }}
            </div>
        {% endfor %}
    </div>
{% endmacro %}
