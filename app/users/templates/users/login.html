{% extends 'base.html' %}

{% block content %}
<section class="section-card mx-auto" style="max-width: 520px;">

    <p class="eyebrow">ЛАБОРАТОРНА №4</p>
    <h1 class="section-title">Вхід у систему</h1>

    <form method="post" action="{{ url_for('users.login') }}">

        <div class="mb-3">
            <label class="form-label" for="username">
                Ім’я користувача
            </label>

            <input
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                required
            >
        </div>

        <div class="mb-4">
            <label class="form-label" for="password">
                Пароль
            </label>

            <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button class="btn btn-primary w-100" type="submit">
            Увійти
        </button>

    </form>

    <p class="muted-text mt-4 mb-0">
        Навчальний вхід:
        <code>tadei</code> /
        <code>lab4pass</code>
    </p>

</section>
{% endblock %}
