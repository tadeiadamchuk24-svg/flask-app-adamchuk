{% extends "base.html" %}

{% block content %}

<div class="row g-4">

    <div class="col-md-4">

        <aside class="section-card">

            <h2 class="h4 mb-4">
                Users Menu
            </h2>

            <nav class="d-flex flex-column gap-3">

                <a class="sidebar-link"
                   href="{{ url_for('users.greetings', name='John', age=30) }}">
                    Привітати John
                </a>

                <a class="sidebar-link"
                   href="{{ url_for('users.greetings', name='Ivan', age=19) }}">
                    Привітати Ivan
                </a>

                <a class="sidebar-link"
                   href="{{ url_for('users.admin') }}">
                    Administrator
                </a>

                <a class="sidebar-link"
                   href="{{ url_for('home') }}">
                    На головну
                </a>

            </nav>

        </aside>

    </div>

    <div class="col-md-8">

        <section class="section-card">

            <span class="eyebrow">
                USERS BLUEPRINT
            </span>

            <h1 class="display-4 fw-bold mt-3">
                Hello :)
            </h1>

            <h2 class="h4 mt-4">
                User:
                <span class="accent-text">
                    {{ name }}
                </span>
            </h2>

            {% if age is not none %}

                <p class="h5 mt-3 text-success">
                    Age: {{ age }}
                </p>

            {% else %}

                <p class="h5 mt-3 text-warning">
                    Age: Not provided
                </p>

            {% endif %}

        </section>

    </div>

</div>

{% endblock %}
